[base]
env_name = bottlecap

[vec]
total_agents = 1024
num_buffers = 4
num_workers = 8

[env]
max_steps = 600
max_joint_vel = 1.5
table_z = 0.0
gravity = 9.81
grasp_width_max = 0.035
curriculum_stage = 1

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 2000000
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
update_epochs = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.01
momentum = 0.9
minibatch_size = 2048
horizon = 64

[sweep]
metric = perf
goal = maximize
